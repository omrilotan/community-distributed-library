name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to a branch supersedes its running checks; on main every
# commit keeps its own result, so a red one can still be found.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm i
      # `cloudflare:workers` and the binding types are generated from each
      # wrangler config; the files are not committed.
      - run: npm run types
      - run: npm run lint
      - run: npm run typecheck
      # The production builds of the web app and the landing page, the same
      # commands scripts/deploy.mjs runs; the dev servers never run them.
      - run: npm run build
      - run: npm run check:libraries
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm i
      - run: npm run types
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # A fresh database, then the dev servers: playwright.config.ts starts
      # them and waits.
      - run: npm run db:migrate && npm run db:seed
      - run: npm run test:e2e -w @cdl/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
